name: BUILD_AND_TEST

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  backend:
    name: Build and Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore Backend
        run: dotnet restore backend/InvoiceBuilder.Api.slnx

      - name: Build Backend
        run: dotnet build backend/InvoiceBuilder.Api.slnx --no-restore --configuration Release

